specVersion: '3.0'
metadata:
  name: logaligroup.etiquetas
type: application
server:
  customMiddleware:
    - name: fiori-tools-backend-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertError: false
        destinations:
          - name: ZSB_STANDARD_LABELS
            url: /sap/opu/odata/sap/ZSB_STANDARD_LABELS/
            forwardAuthToken: true
    - name: fiori-tools-preview
      afterMiddleware: fiori-tools-backend-proxy
      configuration:
        component: logaligroup.etiquetas
        ui5Theme: sap_horizon