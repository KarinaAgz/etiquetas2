specVersion: "3.0"
metadata:
  name: etiquetas.local
type: application
server:
  customMiddleware:
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertError: false
        ui5:
          path:
            - /resources
            - /test-resources
          url: https://ui5.sap.com
          version: 1.142.0
        backend:
          - path: /sap/opu/odata/sap/ZSB_STANDARD_LABELS
            url: ./localService/mainService
    - name: fiori-tools-appreload
      afterMiddleware: fiori-tools-proxy
      configuration:
        port: 35729
        path: webapp
        delay: 300